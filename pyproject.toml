[project]
name = "techjam-conversational-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1",
  "numpy==2.2.6",
  "openai>=1.0,<2",
  "pyunormalize==17.0.0",
  "rfc8785==0.1.4",
  "sentence-transformers==5.7.0",
  "torch==2.10.0",
  "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
